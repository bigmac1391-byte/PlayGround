<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17151a">
  <meta name="description" content="A choice-rich fantasy romance set in the Thornbound Kingdom.">
  <title>The Thornbound Oath — A Fantasy Romance</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="The Thornbound Oath home"><span class="brand-mark">✦</span><span><small>A FANTASY ROMANCE</small><strong>The Thornbound Oath</strong></span></a>
      <div class="header-actions">
        <button id="codexBtn" class="quiet-btn" type="button">✧ Codex</button>
        <button id="saveBtn" class="quiet-btn" type="button">Saved locally</button>
        <button id="soundBtn" class="quiet-btn" type="button" aria-label="Toggle ambient sound">♫ <span>Sound off</span></button>
        <button id="restartBtn" class="quiet-btn" type="button">New story</button>
      </div>
    </header>
    <main class="layout">
      <aside class="sidebar">
        <section class="journey-card">
          <div class="section-kicker">YOUR CHRONICLE</div>
          <div class="progress-label"><span id="chapterLabel">Chapter I</span><span id="progressText">1 / 20</span></div>
          <div class="progress-track"><span id="progressBar"></span></div>
          <p id="questText" class="quest-text"></p>
        </section>
        <section class="companions-card">
          <div class="section-heading"><span>YOUR COMPANIONS</span><span class="tiny-star">✦</span></div>
          <div id="companions" class="companion-list"></div>
        </section>
        <section class="journal-card">
          <div class="section-heading">JOURNAL <span class="journal-count" id="journalCount">0</span></div>
          <ul id="journalList"></ul>
        </section>
        <div class="sidebar-foot">A tale of trust, courage &amp; chosen hearts<br><span>All romanceable characters are adults.</span></div>
      </aside>
      <section class="play-area">
        <div id="scene" class="scene-card" aria-live="polite"></div>
        <footer class="game-footer"><span>✦ Your choices shape the realm</span><span>Autosaves on this device</span></footer>
      </section>
    </main>
  </div>
  <dialog id="codexDialog" class="codex-dialog">
    <div class="dialog-head"><div><span class="section-kicker">FIELD NOTES</span><h2>The Companions</h2></div><button id="closeCodex" class="close-btn" aria-label="Close codex">×</button></div>
    <div id="codexContent" class="codex-content"></div>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="game.js"></script>
</body>
</html>
